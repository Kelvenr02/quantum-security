name: Testes do jogo

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gameplay:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Obter o projeto
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Preparar Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Verificar sintaxe e todas as suítes Node
        run: npm test
      - name: Verificar as 576 estratégias estacionárias
        run: npm run test:stationary
      - name: Guardar relatórios Node
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: node-results
          path: tmp/node-tests/
          retention-days: 14

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Obter o projeto
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Preparar Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - name: Instalar dependência de desenvolvimento fixada no lockfile
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Instalar Chromium e bibliotecas do sistema
        run: npx playwright install --with-deps chromium
      - name: Verificar interface e integração em Chromium
        run: npm run test:browser
      - name: Guardar resultados, capturas e traces de falhas
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: browser-results
          path: |
            tmp/browser-tests/
            tmp/layout-check*/
            tmp/story-check/
            tmp/feedback-check/
            tmp/continuity-check/
            tmp/progression-check/
            tmp/science-check/
            tmp/accessibility-check/
            tmp/phase7-audio.json
          retention-days: 14
