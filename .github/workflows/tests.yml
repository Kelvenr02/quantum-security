name: Testes do jogo

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gameplay:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Obter o projeto
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Preparar Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Verificar a sintaxe dos scripts
        run: |
          for file in arena.js channel.js resources.js encounters.js metrics.js audio.js training.js story.js graphics.js phases.js boss-model.js bosses.js script.js quantum.js presentation.js tools/build-audio.cjs tools/analyze-balance.cjs tests/stationary.cjs tests/fairness.cjs tests/resources.cjs tests/encounters.cjs tests/channel.cjs tests/arena.cjs tests/gameplay.cjs tests/bosses.cjs tests/balance.cjs tests/training.cjs tests/story.cjs tests/audio.cjs; do
            node --check "$file"
          done
      - name: Verificar as mecânicas e a campanha
        run: node tests/gameplay.cjs
      - name: Verificar arena ampliada, pilotagem e métricas
        run: node tests/arena.cjs
      - name: Verificar pressão do canal e renovação das chaves
        run: node tests/channel.cjs
      - name: Verificar recursos, feedback e retomada no chefe
        run: node tests/resources.cjs
      - name: Verificar encontros, novas ameaças e progressão
        run: node tests/encounters.cjs
      - name: Verificar o treinamento interativo
        run: node tests/training.cjs
      - name: Verificar os oito guardiões e pontos de retomada
        run: node tests/bosses.cjs
      - name: Concluir a campanha com pilotagem simulada
        run: node tests/balance.cjs
      - name: Verificar margens de reação, rotação e ritmo
        run: node tests/fairness.cjs
      - name: Impedir vitórias estacionárias em todos os chefes
        run: node tests/stationary.cjs
      - name: Verificar a abertura e a transição para a missão
        run: node tests/story.cjs
      - name: Verificar o áudio e os arquivos locais
        run: node tests/audio.cjs
